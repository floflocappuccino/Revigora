<!doctype html>
<html lang="da" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Din handlingsplan — Revigora</title>
  <meta name="robots" content="noindex">
  <script src="../assets/js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../assets/css/app.css?v=4">
</head>
<body class="app-body no-js" data-page="handlingsplan">

  <!-- Mockup notice: this app section is a static prototype — no auth, no real data. -->
  <a class="skip-link" href="#main">Spring til indhold</a>

  <header data-app-header></header>

  <main class="app-main" id="main">
    <div class="app-container app-stack app-stack--40">

      <div class="page-header page-header--ruled">
        <div class="page-header__copy">
          <p class="eyebrow" data-plan-eyebrow></p>
          <h1 class="page-header__title page-header__title--72">Din handlingsplan</h1>
        </div>
        <p class="page-header__aside" data-plan-intro></p>
      </div>

      <div class="rail-layout">
        <div class="rail" role="tablist" aria-label="Handlingsplan" aria-orientation="vertical">
          <button type="button" class="rail-link rail-link--44" role="tab" id="tab-kost" aria-controls="kost" data-plan-nav="kost">
            <svg class="icon-16" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10h14a7 7 0 0 1-14 0Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 7c0-1.5 1-2 1-3.5M11.5 7c0-1.5 1-2 1-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            Kost
          </button>
          <button type="button" class="rail-link rail-link--44" role="tab" id="tab-tilskud" aria-controls="tilskud" data-plan-nav="tilskud">
            <svg class="icon-16" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="7" width="14" height="6" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 7v6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
            Tilskud
          </button>
        </div>

        <div class="rail-content">
          <section class="plan-pane" id="kost" role="tabpanel" aria-labelledby="tab-kost">
            <div class="section-head">
              <h2 class="section-head__title">Kost</h2>
              <p class="section-head__intro" data-diet-intro></p>
              <div class="targets" data-plan-targets></div>
            </div>
            <div class="segmented" role="tablist" aria-label="Fødevarer">
              <button type="button" class="segmented__btn" role="tab" data-diet-list="enjoy">
                <svg class="icon-14 segmented__ok" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5L6.5 12L13 4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span data-seg-label>Nyd disse</span>
              </button>
              <button type="button" class="segmented__btn" role="tab" data-diet-list="limit">
                <svg class="icon-14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.2 11.8L11.8 4.2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
                <span data-seg-label>Begræns disse</span>
              </button>
            </div>
            <div class="alpha-bar">
              <button type="button" class="alpha-bar__search" aria-label="Søg i fødevarer" aria-expanded="false" aria-controls="food-search" data-food-search-open>
                <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.6 10.6L14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              </button>
              <span class="alpha-bar__rule" aria-hidden="true"></span>
              <div class="alpha-bar__search-field" data-food-search>
                <label class="visually-hidden" for="food-search">Søg efter fødevare</label>
                <input type="search" id="food-search" placeholder="Søg fødevare" autocomplete="off">
              </div>
              <nav class="letters" aria-label="Spring til bogstav" data-letters></nav>
            </div>
            <div class="foods" data-foods></div>
          </section>

          <section class="plan-pane" id="tilskud" role="tabpanel" aria-labelledby="tab-tilskud" hidden>
            <div class="section-head">
              <h2 class="section-head__title">Tilskud</h2>
              <p class="section-head__intro" data-sup-intro></p>
              <div class="targets" data-plan-targets></div>
            </div>
            <div class="supplements" data-supplements></div>
          </section>
        </div>
      </div>

    </div>
  </main>

  <nav data-app-tabbar></nav>

  <script src="../assets/js/app-data.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
