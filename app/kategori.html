<!doctype html>
<html lang="da" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kategori — Revigora</title>
  <meta name="robots" content="noindex">
  <script src="../assets/js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../assets/css/app.css?v=4">
</head>
<body class="app-body no-js" data-page="kategori">

  <!-- Mockup notice: this app section is a static prototype — no auth, no real data. -->
  <a class="skip-link" href="#main">Spring til indhold</a>

  <header data-app-header></header>

  <main class="app-main app-main--tight" id="main">
    <div class="app-container app-stack app-stack--28">

      <div class="crumb-bar" data-crumbs></div>

      <section class="cat-hero ink-card" data-cat-hero aria-labelledby="cat-title">
        <p class="cat-hero__eyebrow" data-hero-eyebrow></p>
        <h1 class="cat-hero__title" id="cat-title" data-hero-title></h1>
        <p class="cat-hero__tagline" data-hero-tagline></p>
        <a class="cat-hero__btn" href="#om-kategorien">
          <svg class="icon-14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3h4.5A1.5 1.5 0 0 1 9 4.5V13a1.5 1.5 0 0 0-1.5-1.5H3V3ZM13 3H10.5A1.5 1.5 0 0 0 9 4.5V13a1.5 1.5 0 0 1 1.5-1.5H13V3Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          Læs om kategorien
        </a>
        <svg class="cat-hero__orbit" width="460" height="380" viewBox="0 0 460 380" aria-hidden="true" data-hero-orbit></svg>
      </section>

      <div class="insights" id="noter">
        <section class="card dist-card" aria-labelledby="dist-title">
          <p class="eyebrow dist-card__eyebrow" id="dist-title" data-dist-eyebrow></p>
          <div class="histogram" data-histogram></div>
          <a class="card-footer-link" href="#biomarkoerer">
            Se alle biomarkører
            <svg class="icon-12" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 3L7.5 6L4.5 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
        </section>
        <article class="card cat-notes-card">
          <div class="cat-notes-card__body">
            <p class="eyebrow" data-cat-notes-eyebrow></p>
            <div class="notes-card__head">
              <h2 class="cat-notes-card__title">Lægeteamets noter</h2>
              <svg class="notes-card__icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v6a5 5 0 0 0 10 0V3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M11 14v2.5a4.5 4.5 0 0 0 9 0V14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="20" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
            </div>
            <p class="notes-card__date" data-cat-notes-date></p>
            <p class="cat-notes-card__text" data-cat-notes-excerpt></p>
          </div>
          <button type="button" class="card-footer-link" aria-haspopup="dialog" aria-controls="notes-panel" data-open-notes>
            Læs hele noten
            <svg class="icon-12" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 3L7.5 6L4.5 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </article>
      </div>

      <section class="cat-list" id="biomarkoerer" aria-labelledby="cat-count">
        <div class="list-header list-header--tight">
          <h2 class="list-header__count" id="cat-count" aria-live="polite" data-cat-count></h2>
          <div class="filter-chips" role="group" aria-label="Filtre" data-cat-chips></div>
        </div>
        <div class="cat-list__rows" data-cat-rows></div>
      </section>

      <section class="about" id="om-kategorien" aria-labelledby="about-title">
        <div class="about__rail">
          <p class="eyebrow">Om kategorien</p>
          <h2 class="about__title" id="about-title" data-about-title></h2>
          <nav class="about__nav" aria-label="Afsnit" data-about-nav></nav>
        </div>
        <div class="about__body" data-about-body></div>
      </section>

    </div>
  </main>

  <div class="cat-sticky" aria-hidden="true" data-cat-sticky>
    <div class="cat-sticky__inner ink-card">
      <div class="cat-sticky__left">
        <a class="cat-sticky__back" href="helbred.html" aria-label="Tilbage til Dit helbred" tabindex="-1">
          <svg class="icon-14" viewBox="0 0 12 12" aria-hidden="true"><path d="M7.5 3L4.5 6L7.5 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <p class="cat-sticky__title" data-sticky-title></p>
      </div>
      <div class="cat-sticky__right">
        <div class="cat-sticky__split" data-sticky-split></div>
        <span class="cat-sticky__divider" aria-hidden="true"></span>
        <nav class="cat-sticky__links" aria-label="Afsnit i kategorien">
          <a href="#biomarkoerer" tabindex="-1">Biomarkører</a>
          <a href="#noter" tabindex="-1">Lægeteamets noter</a>
          <a href="#om-kategorien" tabindex="-1">Om kategorien</a>
        </nav>
      </div>
    </div>
  </div>

  <div class="panel-scrim" hidden data-panel-scrim></div>
  <aside class="side-panel" id="notes-panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" hidden data-notes-panel>
    <div class="side-panel__head">
      <p class="eyebrow" data-panel-eyebrow></p>
      <button type="button" class="icon-btn" aria-label="Luk" data-panel-close>
        <svg class="icon-12" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2L8 8M8 2L2 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="side-panel__body">
      <div class="side-panel__title-row">
        <h2 class="side-panel__title" id="panel-title">Lægeteamets noter</h2>
        <svg class="side-panel__icon" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v6a5 5 0 0 0 10 0V3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M11 14v2.5a4.5 4.5 0 0 0 9 0V14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="20" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </div>
      <p class="notes-card__date" data-panel-meta></p>
      <div class="side-panel__text" data-panel-body></div>
    </div>
    <div class="side-panel__foot">
      <a class="btn-mint btn-mint--48 btn-mint--grow" href="handlingsplan.html">Se tiltag i din handlingsplan</a>
      <a class="btn-outline btn-outline--48" href="noter.html">Alle noter</a>
    </div>
  </aside>

  <nav data-app-tabbar></nav>

  <script src="../assets/js/app-data.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
